# 이슈 PR을 Merge하면(이슈 파일이 main에 들어오면) 이슈 글을 HTML에 직접 써 넣는다.
# 월요일 숫자 갱신은 rates-weekly.yml 안에서 같이 처리한다.
name: rates-prerender

on:
  push:
    branches: [main]
    paths:
      - 'rates/data/issues/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates-weekly
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML 미리 채우기
        run: python scripts/rates/prerender.py
      - name: 변경분 커밋
        run: |
          git config user.name "ddongchane-design"
          git config user.email "ddongchane-design@users.noreply.github.com"
          git add rates/index.html rates/issuance/index.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "주간 이슈를 페이지에 반영"
            git pull --rebase
            git push
          fi
