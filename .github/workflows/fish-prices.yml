# 수산시장 메뉴 구성 계산기 — 노량진수산시장 '오늘의 경락시세'를 매일 아침 받아 fish-menu/data/ 를 갱신하고 커밋한다.
# 경매는 새벽에 끝나서 오전이면 그날 시세가 올라와 있다. 일요일은 경매가 없어 쉰다.
# 받지 못한 날은 지난 자료를 그대로 둔다(화면은 최근 7거래일 평균이라 하루 빠져도 크게 안 바뀜).
name: fish-prices

on:
  schedule:
    # 정각·30분은 붐벼서 피함. 두 번 걸어 두고, 이미 받은 날은 collect.py 가 다시 안 받는다.
    - cron: '17 1 * * 1-6'    # 월~토 10:17 KST
    - cron: '47 3 * * 1-6'    # 월~토 12:47 KST
  workflow_dispatch:
    inputs:
      days:
        description: '최근 며칠을 다시 훑을지 (비우면 6)'
        required: false

permissions:
  contents: write

concurrency:
  group: fish-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 경락시세 수집
        env:
          TZ: Asia/Seoul
        run: |
          cd scripts/fish
          python collect.py --days "${{ github.event.inputs.days || 6 }}"

      - name: 변경분 커밋
        run: |
          git config user.name "ddongchane-design"
          git config user.email "ddongchane-design@users.noreply.github.com"
          git add fish-menu/data
          if git diff --cached --quiet; then
            echo "바뀐 값 없음"
          else
            git commit -m "수산시장 시세 자동 갱신 ($(jq -r '.window[1]' fish-menu/data/prices.json) 까지)"
            git pull --rebase
            git push
          fi
