# 주간 금리 동향 — 일요일 오후(한국시간)에 지난 영업일 기준 지표를 받아 rates/data/ 를 갱신하고 커밋한다.
# Cloudflare Pages가 커밋을 보고 자동 배포한다. (이슈 글은 월요일 아침 Claude 예약 작업이 PR로 올림)
# 필요한 비밀값: Settings → Secrets and variables → Actions → ECOS_API_KEY
name: rates-weekly

on:
  schedule:
    # GitHub 예약 실행은 붐비면 늦거나 빠질 수 있어서 세 번 걸어 둔다 (정각·30분 피함).
    # 이미 그날 받았으면 뒤의 실행은 건너뛴다(collect.py --skip-if-fresh).
    - cron: '17 6 * * 0'    # 일 15:17 KST
    - cron: '47 6 * * 0'    # 일 15:47 KST
    - cron: '17 7 * * 0'    # 일 16:17 KST
  workflow_dispatch:
    inputs:
      asof:
        description: '기준일 (YYYY-MM-DD, 비우면 지난 영업일)'
        required: false

permissions:
  contents: write

concurrency:
  group: rates-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl==3.1.5 holidays

      - name: 지표 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          TZ: Asia/Seoul
        run: |
          cd scripts/rates
          if [ -n "${{ github.event.inputs.asof }}" ]; then
            python collect.py weekly --asof "${{ github.event.inputs.asof }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python collect.py weekly --skip-if-fresh || exit 1
            [ -f /tmp/rates_skip ] && { echo "오늘 이미 받음 — 건너뜀"; exit 0; }
          else
            python collect.py weekly
          fi
          python export_excel.py
          python issuance.py weekly || echo "금융채 발행 수집 실패 (다른 지표는 정상 반영)"
          python prerender.py   # 숫자를 HTML에 직접 써 넣기 (검색 로봇용)

      - name: 변경분 커밋
        run: |
          git config user.name "ddongchane-design"
          git config user.email "ddongchane-design@users.noreply.github.com"
          git add rates/data rates/index.html rates/issuance/index.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "바뀐 값 없음"
          else
            git commit -m "주간 금리 동향 자동 갱신 ($(jq -r .asof rates/data/latest.json) 기준)"
            git push
          fi
